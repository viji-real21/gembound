      - generic [ref=e1508]:
        - heading "Questions and Answers" [level=3] [ref=e1510]
        - generic [ref=e1512]:
          - generic [ref=e1513]:
            - button "How long does it take to get started?" [ref=e1514] [cursor=pointer]
            - navigation "How long does it take to get started?":
              - paragraph [ref=e1520]: Our turnaround is lightning-fast. Just one week from signing off and we’re there with the kick-off meeting to get it rolling.
          - generic [ref=e1521]:
            - button "What is your typical working process?" [ref=e1522] [cursor=pointer]
            - navigation "What is your typical working process?":
              - paragraph [ref=e1528]: It all starts with grabbing a cup of coffee, chilling with mates, and some quality time at the PlayStation (just kidding!). We always start a project with analysis, learning the requirements, and making estimates that will be shared in the price proposal. Then it’s off to signing off, kicking off, and getting your business to the next level with a pinch of our design magic.
          - generic [ref=e1529]:
            - button "Do you work on a fixed-price basis or time and material?" [ref=e1530] [cursor=pointer]
            - navigation "Do you work on a fixed-price basis or time and material?":
              - paragraph [ref=e1536]: Flexibility is the key of success in this crazy world, so we try to suggest an appropriate solution for each specific case we deal with. The more clear and detailed the requirements are, the more accurate will our estimates be. This is the closest we get to the fixed-price model.
          - generic [ref=e1537]:
            - button "How do you usually start new collaborations?" [ref=e1538] [cursor=pointer]
            - navigation "How do you usually start new collaborations?":
              - paragraph [ref=e1544]:
                - text: Each new engagement starts with an introduction call and filling out the design/branding brief. If you have a cool project in mind, feel free to get in touch at
                - link "hello@outcrowd.io" [ref=e1545] [cursor=pointer]:
                  - /url: mailto:hello@outcrowd.io
          - generic [ref=e1546]:
            - button "Do you guys work with big companies only? We’re an early-stage startup." [ref=e1547] [cursor=pointer]
            - navigation "Do you guys work with big companies only? We’re an early-stage startup.":
              - paragraph [ref=e1553]:
                - text: We’re all for building a borderless world, so we are open to working with any project we come across. By the way, we do believe in startups, and one of those we helped develop from scratch has been sold to
                - link "businesswire.com" [ref=e1554] [cursor=pointer]:
                  - /url: https://www.businesswire.com/news/home/20210310005166/en/%C2%A0Entercom-Acquires-Podcast-Influencers-Marketplace-Podcorn
          - generic [ref=e1555]:
            - button "How long it will take to get an estimate from you?" [ref=e1556] [cursor=pointer]
            - navigation "How long it will take to get an estimate from you?":
              - paragraph [ref=e1562]: We hate to keep you waiting. Setting up a team, making preliminary research and analysis, and getting back to you with the contract will take up to 24 hours from the moment we learn what’s needed. Efficiency is one of Outcrowd’s key values.
          - generic [ref=e1563]:
            - button "Do you have a minimum engagement?" [ref=e1564] [cursor=pointer]
            - navigation "Do you have a minimum engagement?":
              - paragraph [ref=e1570]: We set no entry thresholds for people who want to work with us. But we still believe that a product that needs to be designed can’t be made within a couple of days. After all, we need some time to research, analyze and come up with a strategy. So we’ve set a minimum project duration as 30 hours and we’re waiting for you!
          - generic [ref=e1571]:
            - button "What’s the average project duration?" [ref=e1572] [cursor=pointer]
            - navigation "What’s the average project duration?":
              - paragraph [ref=e1578]: Our team works full-time on every project, so the overall duration will highly depend on the initial estimate. On average, our projects last from 2 weeks to 5 months.
          - generic [ref=e1579]:
            - button "Can we start the design without wireframes?" [ref=e1580] [cursor=pointer]
            - navigation "Can we start the design without wireframes?":
              - paragraph [ref=e1586]: Wireframes help to build UX without distractions. The wireframe is an essential part of the design process and we would not recommend eliminating it. Having everything polished at the wireframing stage, we can avoid many amendments and revisions at the design stage, which saves both time and money.
          - generic [ref=e1587]:
            - button "What templates does Outcrowd use to create design?" [ref=e1588] [cursor=pointer]
            - navigation "What templates does Outcrowd use to create design?":
              - paragraph [ref=e1594]: We don’t use pre-built templates or kits because there’s just no soul in them. We’re committed to building fully customized and product-based solutions that will meet the expectations of the target users. Each pixel and line is designed with love and passion by our creative minds.
          - generic [ref=e1595]:
            - button "Where should I start with my business if I have an idea?" [ref=e1596] [cursor=pointer]
            - navigation "Where should I start with my business if I have an idea?":
              - paragraph [ref=e1602]: Hey, you’ve come to the right place! Please get in touch and we’ll help you with the ideation, design, and development. Full cycle on us, no hassle for you. Easy, right?
